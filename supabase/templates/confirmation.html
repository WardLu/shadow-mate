<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f2faf4;color:#203326;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
      <div style="padding:28px;border-radius:20px;background:#fff;box-shadow:0 12px 36px rgba(31,70,42,.12);">
        <h1 style="margin:0 0 16px;color:#1f7a39;font-size:24px;">
          {{ if eq .Data.product_id "shadow-mate" }}影伴 Shadow Mate{{ else if .Data.product_name }}{{ .Data.product_name }}{{ else }}Shadow Nexus{{ end }}
        </h1>
        <h2 style="margin:0 0 12px;font-size:20px;">欢迎注册</h2>
        <p style="margin:0 0 16px;line-height:1.7;">请使用下面的验证码完成邮箱注册：</p>
        <div style="margin:20px 0;padding:16px;border-radius:14px;background:#e8f7eb;color:#1f7a39;text-align:center;font-size:32px;font-weight:800;letter-spacing:8px;">
          {{ .Token }}
        </div>
        <p style="margin:0 0 20px;color:#647268;font-size:13px;line-height:1.7;">验证码只能使用一次。如果邮件客户端支持按钮，也可以点击下方按钮完成验证。</p>
        <p style="margin:0 0 20px;text-align:center;">
          <a href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}{{ end }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:12px 28px;border-radius:10px;background:#2fa84f;color:#fff;text-decoration:none;font-weight:700;">完成注册</a>
        </p>
        <p style="margin:0;color:#87938a;font-size:12px;line-height:1.6;">如果您没有请求注册，请忽略此邮件。</p>
      </div>
    </div>
  </body>
</html>
