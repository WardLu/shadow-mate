name: Release production verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已部署的 Release tag，例如 v1.3.4"
        required: true
        type: string
      url:
        description: "生产站点 HTTPS 地址"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-production:
    name: verify deployed release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build release candidate
        run: npm run build

      - name: Verify deployed release
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ inputs.url }}
          RELEASE_REQUIRE_PRODUCTION: "1"
          RELEASE_REQUIRE_DEPLOYMENT_CHECKLIST: "1"
