<style>
  :root{
    --green:#2fa84f;
    --green-deep:#1f7a39;
    --green-soft:#e8f7ec;
    --green-light:#d4f0db;
    --yellow:#ffc83d;
    --yellow-soft:#fff4d6;
    --ink:#243024;
    --ink-soft:#5b6b5b;
    --card:#ffffff;
    --bg:#f1f7f2;
    --line:#e2efe5;
    --shadow:0 6px 18px rgba(31,122,57,.12);
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    overscroll-behavior:none;
  }
  /* 竖屏手机容器，桌面端居中模拟 iPad 竖屏 */
  .app{
    max-width:460px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#eafaf0 0%,#f1f7f2 220px);
  }
  /* 顶部品牌条 */
  .topbar{
    display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#eafaf0, rgba(234,250,240,.85));
    backdrop-filter:blur(6px);
  }
  .logo{
    width:42px;height:42px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--green),var(--green-deep));
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:var(--shadow);
  }
  .topbar h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px;}
  .topbar .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .datepill{
    margin-left:auto;font-size:12px;color:var(--green-deep);
    background:var(--green-soft);padding:6px 10px;border-radius:999px;font-weight:700;
  }

  .body{flex:1;display:flex;min-height:0;}
  /* 左侧竖版导航 */
  .nav{
    width:74px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
    padding:10px 8px;background:linear-gradient(180deg,#ffffff, #f6fbf7);
    border-right:1px solid var(--line);
  }
  .navbtn{
    border:none;background:transparent;cursor:pointer;border-radius:16px;
    padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:11px;font-weight:700;transition:.18s;
  }
  .navbtn .ic{font-size:22px;line-height:1;}
  .navbtn.active{background:var(--green);color:#fff;box-shadow:var(--shadow);}
  .navbtn:active{transform:scale(.94);}

  /* 右侧主体 */
  .main{flex:1;min-width:0;overflow-y:auto;padding:12px 14px 24px;}
  .module-title{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;}
  .module-title .em{font-size:22px;}
  .module-title h2{font-size:17px;margin:0;font-weight:800;}

  /* 圆角卡片 */
  .card{
    background:var(--card);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);
  }
  .card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px;}
  .card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:6px 0 12px;}

  /* 打卡按钮 */
  .checkin{
    width:100%;border:none;cursor:pointer;border-radius:16px;padding:13px;
    font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--green),var(--green-deep));
    box-shadow:var(--shadow);transition:.18s;
  }
  .checkin:active{transform:scale(.97);}
  .checkin.done{background:#cfd8cf;color:#fff;box-shadow:none;}

  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{
    font-size:12px;background:var(--green-soft);color:var(--green-deep);
    padding:4px 10px;border-radius:999px;font-weight:700;
  }

  /* 识字卡片 */
  .hanzi-card{display:flex;flex-direction:column;align-items:center;padding:14px 8px;}
  .hanzi-big{font-size:72px;font-weight:800;color:var(--ink);line-height:1;}
  .hanzi-py{font-size:18px;color:var(--green-deep);font-weight:700;margin:8px 0 4px;}
  .hanzi-word{font-size:15px;color:var(--ink-soft);}
  .hanzi-meaning{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mini-card{background:var(--green-soft);border-radius:18px;padding:14px;text-align:center;}
  .mini-card .big{font-size:46px;font-weight:800;color:var(--ink);}
  .mini-card .py{font-size:14px;color:var(--green-deep);font-weight:700;margin-top:4px;}
  .mini-card .label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* 古诗词 */
  .poem-title{font-size:18px;font-weight:800;text-align:center;}
  .poem-meta{text-align:center;font-size:12px;color:var(--ink-soft);margin:2px 0 14px;}
  .poem-body{font-size:18px;line-height:2.1;text-align:center;letter-spacing:2px;}
  .video-link{
    display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    color:var(--green-deep);font-size:13px;font-weight:700;text-decoration:none;
    background:var(--yellow-soft);padding:8px 12px;border-radius:999px;
  }

  /* 写字 田字格 */
  .tian{
    width:60px;height:60px;border:2px solid var(--green);border-radius:8px;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;
    background:
      linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,
      linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,
      linear-gradient(to top right,transparent 49%,var(--line) 49%,var(--line) 51%,transparent 51%) ,
      linear-gradient(to top left,transparent 49%,var(--line) 49%,var(--line) 51%,transparent 51%);
  }
  .write-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .stroke-list{display:flex;flex-wrap:wrap;gap:8px;}
  .stroke-chip{background:var(--green-soft);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--green-deep);}

  /* 数学口算 */
  .quiz-box{text-align:center;padding:10px 0;}
  .quiz-q{font-size:40px;font-weight:800;margin:6px 0 14px;letter-spacing:2px;}
  .quiz-input{
    width:120px;font-size:30px;text-align:center;font-weight:800;border:2px solid var(--green);
    border-radius:14px;padding:8px;color:var(--ink);outline:none;
  }
  .lvl-row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
  .lvl-btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .lvl-btn.active{border-color:var(--green);background:var(--green-soft);color:var(--green-deep);}
  .feedback{font-size:14px;font-weight:700;margin-top:10px;min-height:20px;}
  .feedback.ok{color:var(--green-deep);}
  .feedback.no{color:#d9534f;}

  /* 数感游戏 */
  .num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .num-cell{
    aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;background:var(--green-soft);color:var(--green-deep);
    cursor:pointer;border:2px solid transparent;
  }
  .num-cell.miss{background:#fff;border-color:var(--yellow);color:var(--ink);}
  .num-cell.found{background:var(--yellow);color:var(--ink);}

  /* 数独 */
  .sudoku{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:240px;margin:0 auto;}
  .sudoku div{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;border-radius:8px;background:var(--green-soft);color:var(--ink);
  }
  .sudoku div.fixed{background:#d7ead6;color:var(--green-deep);}
  .sudoku input{
    width:100%;height:100%;border:none;background:transparent;text-align:center;
    font-size:22px;font-weight:800;color:var(--green-deep);outline:none;
  }

  /* 英语单词 */
  .word-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 6px;}
  .word-en{font-size:34px;font-weight:800;color:var(--green-deep);}
  .word-ph{font-size:15px;color:var(--ink-soft);margin:4px 0;}
  .word-cn{font-size:16px;font-weight:700;}
  .speak-btn{border:none;background:var(--yellow);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;cursor:pointer;margin-top:10px;}
  .month-review{display:flex;flex-wrap:wrap;gap:6px;}
  .mr-chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 9px;color:var(--ink-soft);}

  /* 首页统计 */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;border-radius:20px;padding:16px;text-align:center;box-shadow:var(--shadow);}
  .stat .n{font-size:32px;font-weight:800;line-height:1;}
  .stat .t{font-size:12px;opacity:.9;margin-top:4px;}
  .progressbar{height:12px;background:var(--green-light);border-radius:999px;overflow:hidden;margin-top:10px;}
  .progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;}

  .banner{
    background:linear-gradient(135deg,#fff4d6,#ffe7a8);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;border:1px solid #ffe1a0;
  }
  .banner .t{font-size:15px;font-weight:800;color:#9a6b00;display:flex;align-items:center;gap:6px;}
  .banner .d{font-size:12.5px;color:#8a6a1f;margin-top:6px;line-height:1.6;}

  .footer{text-align:center;font-size:11px;color:var(--ink-soft);padding:8px 0 18px;}

  /* 积分打卡 · 绿色挖掘机主题（卡片化 / 圆角活泼） */
  .exc-banner{
    background:linear-gradient(135deg,#eafaf0,#d4f0db);
    border:2px solid var(--green-light);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow);
  }
  .exc-banner .em{font-size:36px;filter:drop-shadow(0 3px 3px rgba(31,122,57,.25));}
  .exc-banner .t{font-size:15px;font-weight:800;color:var(--green-deep);}
  .exc-banner .d{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .exc-banner .badge{margin-left:auto;font-size:12px;background:var(--yellow);color:var(--ink);font-weight:800;padding:6px 12px;border-radius:999px;box-shadow:0 2px 6px rgba(255,200,61,.5);}

/* =========================================================
   状态 / 存档层（localStorage 永久存档）
   ========================================================= */
const STORE_KEY = "shadow_mate_workbench_v1";

function readStoredState(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw === null) return {};
  try{
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" ? parsed : {};
  }catch(error){
    console.warn("忽略无法解析的本地存档", error);
  }
  return {};
}

let store = readStoredState();
if(!store.checkins) store.checkins = {};   // {date: {module:true}}
if(!store.extra) store.extra = {};         // 扩展记录（如数学题数）
if(!store.points) store.points = {};       // {ym: {itemIdx: {day:1}}} 积分打卡记录
if(!store.bookShelf) store.bookShelf = {};  // {bookIdx:1} 绘本已读标记
if(!store.peanutLog) store.peanutLog = [];  // [{title,date,rating}] 小花生阅读记录
if(!store.peanutRead) store.peanutRead = {}; // {bookIdx:1} 小花生书单已读标记

function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
  window.cloudSync?.schedule();
}

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dayIndex(){
  const d = new Date(); d.setHours(0,0,0,0);
  const start = new Date(d.getFullYear(),0,1);
  return Math.floor((d - start)/86400000);
}
function dateKeyOffset(off){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-off);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isChecked(mod){
  const t = todayKey();
  return !!(store.checkins[t] && store.checkins[t][mod]);
}
function doCheck(mod){
  const t = todayKey();
  if(!store.checkins[t]) store.checkins[t] = {};
  store.checkins[t][mod] = true;
  save();
}
function streak(mod){
  let s = 0;
  for(let i=0;i<400;i++){
    const k = dateKeyOffset(i);
    if(store.checkins[k] && store.checkins[k][mod]) s++;
    else if(i>0) break;
  }
  return s;
}
function totalChecked(mod){
  let n = 0;
  for(const k in store.checkins) if(store.checkins[k][mod]) n++;
  return n;
}

/* 积分打卡辅助 */
function ymKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1); }
function pointOn(itemIdx, day){
  const ym = ymKey();
  return !!(store.points[ym] && store.points[ym][itemIdx] && store.points[ym][itemIdx][day]);
}
function togglePoint(itemIdx, day){
  const ym = ymKey();
  if(!store.points[ym]) store.points[ym] = {};
  if(!store.points[ym][itemIdx]) store.points[ym][itemIdx] = {};
  if(store.points[ym][itemIdx][day]) delete store.points[ym][itemIdx][day];
  else store.points[ym][itemIdx][day] = 1;
  save();
}
function itemMonthTotal(itemIdx){
  const ym = ymKey();
  const rec = store.points[ym] && store.points[ym][itemIdx];
  if(!rec) return 0;
  return POINT_ITEMS[itemIdx].pts * Object.keys(rec).length;
}
function monthTotal(){
  let s = 0;
  for(let i=0;i<POINT_ITEMS.length;i++) s += itemMonthTotal(i);
  return s;
}
function dayTotal(day){
  let s = 0;
  for(let i=0;i<POINT_ITEMS.length;i++) if(pointOn(i,day)) s += POINT_ITEMS[i].pts;
  return s;
}

  const a = Math.floor(Math.random()*(mathLevel+1));

  const op = Math.random()<0.5 ? "+" : "−";
  if(op==="+"){ mathAns=a+b; return `${a} ${op} ${b} = ?`; }
  else { const big=Math.max(a,b), small=Math.min(a,b); mathAns=big-small; return `${big} ${op} ${small} = ?`; }
}

function buildSudoku(){
  // 固定一个合法解，挖空部分
  const sol = [
    [1,2,3,4],
    [3,4,1,2],
    [2,1,4,3],
    [4,3,2,1]
  ];
  const blanks = new Set([1,4,6,9,11,14]); // 挖空位置(0-indexed)
  const box = el("sudoku"); if(!box) return;
  box.innerHTML="";
  let idx=0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const v=sol[r][c];
    if(blanks.has(idx)){
      const inp=document.createElement("div");
      inp.innerHTML=`<input type="number" min="1" max="4" data-r="${r}" data-c="${c}" style="width:100%">`;
      box.appendChild(inp.firstChild);
    } else {
      const d=document.createElement("div");
      d.className="fixed"; d.textContent=v;
      box.appendChild(d);
    }
    idx++;
  }
  const sf=el("sf");
  box.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
    // 简单校验行/列/宫
    const r=+inp.dataset.r, c=+inp.dataset.c, val=+inp.value;
    let ok=true;
    if(val<1||val>4) ok=false;
    // 检查同行
    for(let cc=0;cc<4;cc++){ const cell=box.children[r*4+cc]; const cv=cell.querySelector? (cell.querySelector("input")?+cell.querySelector("input").value: +cell.textContent):null; if(cc!==c && cv===val){ok=false;} }
    if(ok) sf.textContent="继续加油，把空格都填完吧！"; else sf.textContent="这一格和别处重复啦～";
  });
}

  el("ptclear").onclick=()=>{
    if(confirm("确定清空本月所有积分打卡记录？")){
      delete store.points[ymKey()]; save(); PT_DAY=today; renderPoints();
    }
  };
  main.appendChild($(`<div class="footer">⭐ 每日按日期记录 · 本机离线保存并可同步云端</div>`));
}

/* =========================================================
   渲染：绘本读物（独立栏目）
   ========================================================= */
function renderBook(){
  const main = el("main"); main.innerHTML="";
  main.appendChild(modTitle("📚","绘本读物"));

  const BOOKS = [
    {t:"好饿的毛毛虫",   r:"美国",  a:"艾瑞·卡尔"},
    {t:"棕色的熊，棕色的熊", r:"美国", a:"比尔·马丁"},
    {t:"猜猜我有多爱你", r:"欧盟(英)", a:"山姆·麦克布雷尼"},
    {t:"逃家小兔",       r:"美国",  a:"玛格丽特·怀兹·布朗"},
    {t:"小熊宝宝",       r:"日本",  a:"佐佐木洋子"},
    {t:"点点点",         r:"法国",  a:"埃尔维·杜莱"},
    {t:"是谁嗯嗯在我头上", r:"台湾", a:"维尔纳·霍尔茨瓦特"},
    {t:"爷爷一定有办法", r:"加拿大", a:"菲比·吉尔曼"}
  ];
  const di = dayIndex();
  const b = BOOKS[di % BOOKS.length];

  // 今日绘本 + 打卡
  const card1 = $(`
    <div class="card">
      <h3>📖 今日绘本 <span class="pill">${b.r}</span></h3>
      <div class="desc">《${b.t}》— ${b.a}</div>
      <div class="desc">raza 绘本跟读 · 读后完成思考题；26 个字母口语对练、英语句子书写造句每日推送（3-6 岁）。</div>
      <div class="row">
        <span class="pill">跟读</span><span class="pill">读后思考题</span><span class="pill">句子书写</span><span class="pill">每日推送</span>
      </div>
      <div style="height:10px"></div>
      ${checkinBtn("book","绘本")}
    </div>
  `);
  main.appendChild(card1);

  // 我的小书架（已读标记，永久存档）
  let shelf = BOOKS.map((bk,i)=>{
    const read = !!store.bookShelf[i];
    return `<div class="mini-card" data-bk="${i}" style="cursor:pointer;opacity:${read?1:.55}">
      <div class="big" style="font-size:22px">${read?'✅':'📕'}</div>
      <div class="py" style="font-size:13px;margin-top:6px">${bk.t}</div>
      <div class="label">${bk.r}</div>
    </div>`;
  }).join("");
  const readN = Object.keys(store.bookShelf).length;
  const card2 = $(`
    <div class="card">
      <h3>📚 我的小书架 <span class="pill">点击标记已读</span></h3>
      <div class="desc">欧盟、美国、日本、台湾等多地优质绘本，读完并完成思考题后点一下即可标记。</div>
      <div class="grid2">${shelf}</div>
      <div class="desc" style="margin-top:12px">已读 <b>${readN}</b> / ${BOOKS.length} 本</div>
    </div>
  `);
  main.appendChild(card2);
  card2.querySelectorAll("[data-bk]").forEach(c=>{
    c.onclick=()=>{
      const i=+c.dataset.bk;
      if(store.bookShelf[i]) delete store.bookShelf[i]; else store.bookShelf[i]=1;
      save(); renderBook();
    };
  });

  // 小花生APP读物：热门书单 + 我的阅读记录
  const peanutRead = PEANUT_BOOKS.map((b,i)=>{
    const on = !!store.peanutRead[i];
    return `<div class="mini-card" data-pb="${i}" style="cursor:pointer;opacity:${on?1:.6}">
      <div class="big" style="font-size:20px">${on?'✅':'🥜'}</div>
      <div class="py" style="font-size:12px;margin-top:6px">${b.t}</div>
      <div class="label">${b.tag}</div>
    </div>`;
  }).join("");
  const logRows = store.peanutLog.slice().reverse().map((r,idx)=>{
    const stars = "★".repeat(r.rating)+"☆".repeat(5-r.rating);
    return `<div class="log-row">
      <div class="log-main">${r.title}<span class="log-stars">${stars}</span></div>
      <div class="log-meta">${r.date} <span class="log-del" data-del="${idx}">🗑️</span></div>
    </div>`;
  }).join("");

  const card3 = $(`
    <div class="card">
      <h3>🥜 小花生APP读物 <span class="pill">热门书单</span></h3>
      <div class="desc">小花生热门童书与英文分级书单（牛津树 / 红火箭 / 廖彩杏等），点一下标记已读；下方可手记你自己的阅读记录。</div>
      <div class="grid2">${peanutRead}</div>
      <div style="height:12px"></div>
      <div class="pts-sec" style="color:var(--green-deep)">📒 我的阅读记录</div>
      <div class="peanut-form">
        <input class="peanut-input" id="pbTitle" placeholder="输入书名（如：牛津阅读树 L3）">
        <div class="peanut-stars" id="pbStars">
          ${[1,2,3,4,5].map(n=>`<span class="pstar" data-n="${n}">${n<=3?'★':'☆'}</span>`).join("")}
        </div>
        <button class="checkin" id="pbAdd" style="margin-top:8px">＋ 添加阅读记录</button>
      </div>
      <div class="peanut-log">${logRows || '<div class="desc">还没有记录，添加一本吧～</div>'}</div>
    </div>
  `);
  main.appendChild(card3);

  // 绑定：书单已读标记
  card3.querySelectorAll("[data-pb]").forEach(c=>c.onclick=()=>{
    const i=+c.dataset.pb;
    if(store.peanutRead[i]) delete store.peanutRead[i]; else store.peanutRead[i]=1;
    save(); renderBook();
  });
  // 绑定：评分星
  let rating = 3;
  const starEls = card3.querySelectorAll(".pstar");
  const paintStars = (n)=>starEls.forEach(s=>{ s.textContent = (+s.dataset.n<=n?"★":"☆"); });
  starEls.forEach(s=>s.onclick=()=>{ rating=+s.dataset.n; paintStars(rating); });
  // 绑定：添加记录
  el("pbAdd").onclick=()=>{
    const title = el("pbTitle").value.trim();
    if(!title){ alert("请先输入书名"); return; }
    const d = new Date();
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    store.peanutLog.push({title, date:ds, rating});
    save(); renderBook();
  };
  // 绑定：删除记录
  card3.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{
    const i = +x.dataset.del;
    store.peanutLog.splice(store.peanutLog.length-1-i, 1);
    save(); renderBook();
  });

  main.appendChild($(`<div class="footer">📚 本机离线保存 · 登录后跨设备同步</div>`));
}

/* =========================================================
   公共组件
   ========================================================= */
function modTitle(em,t){
  return $(`<div class="module-title"><span class="em">${em}</span><h2>${t}</h2></div>`);
}
function checkinBtn(mod,label){
  const done = isChecked(mod);
  return `<button class="checkin ${done?'done':''}" data-cmod="${mod}" data-clabel="${label}">${done?'✅ 今日已打卡 · '+label:'✔ 完成今日打卡 · '+label}</button>`;
}

/* =========================================================
   导航切换
   ========================================================= */
let CURRENT_MOD = "home";
function switchMod(mod){
  CURRENT_MOD = mod;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.mod===mod));
  if(mod==="home") renderHome();
  else if(mod==="chinese") renderChinese();
  else if(mod==="math") renderMath();
  else if(mod==="english") renderEnglish();
  else if(mod==="book") renderBook();
  else if(mod==="points") renderPoints();
  else if(mod==="grow") renderGrow();
  // 绑定打卡按钮
  el("main").querySelectorAll("[data-cmod]").forEach(btn=>{
    btn.onclick=()=>{
      const m=btn.dataset.cmod;
      if(!isChecked(m)){ doCheck(m); switchMod(mod); }
    };
  });
  el("main").scrollTop=0;
}

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>switchMod(b.dataset.mod));

// 日期显示
(function(){
  const d=new Date();
  const wk=["日","一","二","三","四","五","六"][d.getDay()];
  el("datepill").textContent=`${d.getMonth()+1}月${d.getDate()}日 周${wk}`;
})();

// 初始渲染
switchMod("home");

window.learningDesk = {
  getState(){
    return JSON.parse(JSON.stringify(store));
  },
  replaceState(next, options = {}){
    store = next && typeof next === "object" ? next : {};
    if(!store.checkins) store.checkins = {};
    if(!store.extra) store.extra = {};
    if(!store.points) store.points = {};
    if(!store.bookShelf) store.bookShelf = {};
    if(!store.peanutLog) store.peanutLog = [];
    if(!store.peanutRead) store.peanutRead = {};
    if(options.persist) localStorage.setItem(STORE_KEY, JSON.stringify(store));
    switchMod(CURRENT_MOD);
  },
  clearLocalData(){
    localStorage.removeItem(STORE_KEY);
    window.location.reload();
  }
};
</script>
<script type="module" src="/src/cloud.js"></script>
