<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Mate Logo 06：四层学习切片</title>
  <desc id="desc">四条有层次的学习切片代表语文、数学、英语和绘本，中央发光层代表当天正在完成的学习状态。</desc>
  <defs>
    <linearGradient id="sliceGrad" x1="17" y1="31" x2="104" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="sliceGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="25" y="21" width="70" height="78" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <path d="M60 18V102" stroke="url(#sliceGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>
  <rect x="20" y="29" width="80" height="11" rx="3" fill="#3B82F6" opacity=".38"/>
  <g filter="url(#sliceGlow)">
    <rect x="15" y="48" width="90" height="14" rx="4" fill="url(#sliceGrad)"/>
    <rect x="31" y="52" width="58" height="5" rx="2.5" fill="#FFFFFF" opacity=".42"/>
  </g>
  <rect x="20" y="71" width="80" height="11" rx="3" fill="#A855F7" opacity=".38"/>
  <rect x="27" y="88" width="66" height="6" rx="3" fill="#334155"/>
  <circle cx="60" cy="55" r="3" fill="#FFFFFF"/>
  <circle cx="60" cy="55" r="7" stroke="#22D3EE" stroke-width="1.5" opacity=".7"/>
  <path d="M11 35H20M100 35H109M11 77H20M100 77H109" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
</svg>
