<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Mate Logo 08：开放书页</title>
  <desc id="desc">两页打开的书形成向上的光路，代表学习、陪伴和从每天的阅读中长出新的可能。</desc>
  <defs>
    <linearGradient id="bookGrad" x1="24" y1="35" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="bookGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="25" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <path d="M60 44C50 35 38 32 25 35V86C39 83 50 87 60 95V44Z" fill="#1E293B" stroke="url(#bookGrad)" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M60 44C70 35 82 32 95 35V86C81 83 70 87 60 95V44Z" fill="#111827" stroke="url(#bookGrad)" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M60 44V95" stroke="#818CF8" stroke-width="2"/>
  <path d="M34 49C42 47 49 50 55 55M86 49C78 47 71 50 65 55" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#bookGlow)">
    <path d="M60 43C60 31 66 24 78 20" stroke="url(#bookGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m74 20 5 0-2 5" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="40" r="3" fill="#FFFFFF"/>
  </g>
</svg>
