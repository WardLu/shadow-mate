# Shadow Mate Workflow Update Auth Configuration And Documentation

## Action

Follow the update-auth-configuration-and-documentation workflow:
1. Edit supabase/config.toml to update auth settings or provider limits
2. Update docs/auth-setup.md to reflect changes in authentication configuration
3. Optionally update or add email templates in supabase/templates/
4. Optionally update related architecture documentation

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: supabase/config.toml, docs/auth-setup.md, supabase/templates/*.html

