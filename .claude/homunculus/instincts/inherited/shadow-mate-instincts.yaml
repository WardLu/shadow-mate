# Shadow Mate Workflow Feature Development With Auth And Database

## Action

Follow the feature-development-with-auth-and-database workflow:
1. Update or add backend logic in src/ (e.g., app.js, cloud.js, lib.js, action-lock.js, learning-state.js)
2. Create or modify database migration files in supabase/migrations/
3. Update Supabase configuration (supabase/config.toml)
4. Add or update email templates (supabase/templates/)
5. Update or add tests (tests/unit/, tests/e2e/, supabase/tests/)
6. Update documentation (docs/architecture.md, docs/auth-setup.md, docs/security-baseline.md, docs/user-guide.md, docs/test-scope.md)
7. Update project meta files (CHANGELOG.md, ROADMAP.md, TODO.md, README.md, RELEASE_NOTES.md)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/app.js, src/cloud.js, src/lib.js

